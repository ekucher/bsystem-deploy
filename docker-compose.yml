# BSYSTEM platform stack.
#
# Published ports bind to ${BIND_ADDRESS:-127.0.0.1} so a `docker compose up`
# on a host with a public interface does not expose authentik, the Integration
# Core or the HUB to the internet. Put a TLS-terminating proxy in front and set
# BIND_ADDRESS deliberately when that is what you want.
#
# The hardening below (no-new-privileges, dropped capabilities, read-only root
# filesystems) is validated against this file by `docker compose config` and,
# for the equivalent settings in docker-compose.e2e.yml, exercised by the E2E
# job on every push. This file's own services are not run in CI.
name: bsystem-platform

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    # The postgres entrypoint starts as root and drops to the postgres user,
    # so it keeps the capabilities that requires and nothing else. PGDATA is
    # written, so the filesystem cannot be read-only.
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    environment:
      POSTGRES_USER: bsystem
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bsystem -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [data]

  nats:
    image: nats:2.11-alpine
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    # The nats image already runs as an unprivileged user; JetStream writes to
    # /data, so the filesystem stays writable.
    cap_drop: [ALL]
    command: ["-js", "-sd", "/data", "-m", "8222"]
    volumes:
      - nats_data:/data
    networks: [backend]

  authentik-server:
    image: ghcr.io/goauthentik/server:2026.8.2
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    # authentik's entrypoint manages its own privileges, runs migrations and
    # writes media and certificate material. Only no-new-privileges is applied
    # here: a capability set for it belongs in an owner-run hardening pass
    # against a real deployment, not in an unverified guess.
    command: server
    environment: &authentik_env
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY}
      AUTHENTIK_POSTGRESQL__HOST: postgres
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_POSTGRESQL__USER: bsystem
      AUTHENTIK_POSTGRESQL__PASSWORD: ${POSTGRES_PASSWORD}
      # First-start bootstrap, for a host with no browser.
      #
      # Set together, these create authentik's `akadmin` on the first start
      # instead of leaving the unauthenticated /if/flow/initial-setup/ page
      # waiting for somebody to reach it. Empty — the default — changes
      # nothing: the setup flow works as before.
      #
      # They are read on **every** start, not only the first, so a password
      # left here is a static administrator credential sitting in a running
      # container's environment. Clear them once the account exists; the
      # preflight warns while they are set. See docs/DEPLOYMENT.md.
      AUTHENTIK_BOOTSTRAP_EMAIL: ${AUTHENTIK_BOOTSTRAP_EMAIL:-}
      AUTHENTIK_BOOTSTRAP_PASSWORD: ${AUTHENTIK_BOOTSTRAP_PASSWORD:-}
      AUTHENTIK_BOOTSTRAP_TOKEN: ${AUTHENTIK_BOOTSTRAP_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:9000:9000"
      - "${BIND_ADDRESS:-127.0.0.1}:9443:9443"
    volumes:
      - ./authentik/blueprints/bsystem-groups.yaml:/blueprints/bsystem-groups.yaml:ro
    networks: [frontend, data]

  authentik-worker:
    image: ghcr.io/goauthentik/server:2026.8.2
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    # See authentik-server: privileges are left to the image's own entrypoint.
    command: worker
    environment: *authentik_env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./authentik/blueprints/bsystem-groups.yaml:/blueprints/bsystem-groups.yaml:ro
    networks: [data]

  integration-core:
    build:
      context: ../bsystem-integration-core
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    # The server runs as a non-root user from the image and writes nothing to
    # disk: logs go to stdout and every cache is in memory.
    cap_drop: [ALL]
    read_only: true
    environment:
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://bsystem:${POSTGRES_PASSWORD}@postgres:5432/bsystem_integration?sslmode=disable
      NATS_URL: nats://nats:4222
      AUTHENTIK_USERINFO_URL: http://authentik-server:9000/application/o/userinfo/
      ESPOCRM_URL: ${ESPOCRM_URL:-}
      ESPOCRM_API_KEY: ${ESPOCRM_API_KEY:-}
      REDMINE_URL: ${REDMINE_URL:-}
      REDMINE_API_KEY: ${REDMINE_API_KEY:-}
      OUTLINE_URL: ${OUTLINE_URL:-}
      OUTLINE_API_KEY: ${OUTLINE_API_KEY:-}
      # Local token validation. Empty keeps the UserInfo path, which is the
      # default and the only thing that works with an opaque access token.
      # Setting the issuer requires authentik to issue JWT access tokens.
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:-}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-}
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_started
      authentik-server:
        condition: service_started
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:8080:8080"
    networks: [frontend, backend, data]

  hub:
    build:
      context: ../bsystem-hub
      args:
        VITE_OIDC_AUTHORITY: ${VITE_OIDC_AUTHORITY}
        VITE_OIDC_CLIENT_ID: ${VITE_OIDC_CLIENT_ID}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    # The HUB image is nginx-unprivileged: it runs as uid 101 on port 8080 and
    # needs no capability at all. Everything it writes — the pid file and the
    # request temporary paths — is under /tmp.
    cap_drop: [ALL]
    read_only: true
    tmpfs:
      - /tmp
    depends_on:
      integration-core:
        condition: service_started
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:8081:8080"
    networks: [frontend]

networks:
  frontend:
  backend:
    internal: true
  data:
    internal: true

volumes:
  postgres_data:
  nats_data:
