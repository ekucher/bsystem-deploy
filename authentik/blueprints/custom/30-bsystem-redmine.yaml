# yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
#
# Stage 1 native application: Redmine.
#
# Redmine remains authoritative for its own projects/issues (see
# docs/stage-1/08-REDMINE-INTEGRATION.md); this blueprint only lets a human
# sign into Redmine directly through authentik and grants the coarse
# "can reach this app at all" entitlement. It does not attempt to model
# Redmine's own per-project roles or permissions — those stay local to
# Redmine, per the architecture's native-authorization invariant.
#
# Follows the same four-part shape as 10-bsystem-hub.yaml: invalidation flow,
# OAuth2/OIDC provider, application, entitlement + policy bindings.

version: 1

metadata:
  name: BSYSTEM - Redmine

context:
  # Browser-visible canonical origin for Redmine (see .env.example). Empty
  # leaves the redirect_uri pointing nowhere until the operator sets it.
  redmine_public_url: !Env [REDMINE_PUBLIC_URL, ""]

entries:

  # ============================================================
  # Redmine Provider-specific invalidation flow
  # ============================================================

  - id: bsystem-redmine-invalidation-flow
    model: authentik_flows.flow

    identifiers:
      slug: bsystem-redmine-invalidation-flow

    attrs:
      designation: invalidation
      name: BSYSTEM - Redmine logout
      title: "You've logged out of Redmine."
      authentication: none

  - id: bsystem-redmine-invalidation-logout-binding
    model: authentik_flows.flowstagebinding

    identifiers:
      order: 0
      stage: !Find
        - authentik_stages_user_logout.userlogoutstage
        - [name, default-invalidation-logout]
      target: !KeyOf bsystem-redmine-invalidation-flow


  # ============================================================
  # Redmine OAuth2 / OpenID Connect Provider
  #
  # Redirect URI matches the kontron/redmine_oauth callback path this
  # deployment already documents in redmine/README.md
  # (http://localhost:18103/oauth2callback in local DEV). Verify this path
  # against the pinned plugin version before a real STAGE/PROD cutover.
  # ============================================================

  - id: bsystem-redmine-provider
    model: authentik_providers_oauth2.oauth2provider

    identifiers:
      name: Provider for Redmine

    attrs:
      authorization_flow: !Find
        - authentik_flows.flow
        - [slug, default-provider-authorization-implicit-consent]

      invalidation_flow: !KeyOf bsystem-redmine-invalidation-flow

      client_type: public

      grant_types:
        - authorization_code

      redirect_uris:
        - matching_mode: strict
          redirect_uri_type: authorization
          url: !Format ["%s/oauth2callback", !Context redmine_public_url]

      access_code_validity: minutes=1
      access_token_validity: minutes=5
      refresh_token_validity: days=30
      refresh_token_threshold: hours=1

      sub_mode: hashed_user_id
      issuer_mode: per_provider
      include_claims_in_id_token: true

      signing_key: !Find
        - authentik_crypto.certificatekeypair
        - [name, authentik Self-signed Certificate]

      property_mappings:
        - !Find
          - authentik_providers_oauth2.scopemapping
          - [managed, goauthentik.io/providers/oauth2/scope-openid]

        - !Find
          - authentik_providers_oauth2.scopemapping
          - [managed, goauthentik.io/providers/oauth2/scope-profile]

        - !Find
          - authentik_providers_oauth2.scopemapping
          - [managed, goauthentik.io/providers/oauth2/scope-email]

        - !Find
          - authentik_providers_oauth2.scopemapping
          - [managed, goauthentik.io/providers/oauth2/scope-entitlements]

      logout_method: backchannel
      logout_uri: ""

  # ============================================================
  # Redmine Application
  # ============================================================

  - id: bsystem-redmine-application
    model: authentik_core.application

    identifiers:
      slug: bsystem-redmine

    attrs:
      name: Redmine
      provider: !KeyOf bsystem-redmine-provider

      group: BSYSTEM-Redmine
      policy_engine_mode: any

      meta_launch_url: !Context redmine_public_url
      meta_publisher: BSYSTEM
      meta_description: Native project/issue tracking

      meta_hide: false
      open_in_new_tab: false


  # ============================================================
  # Redmine Application Entitlement
  #
  # Coarse "can reach this app at all" only. Project/issue-level permissions
  # stay entirely inside Redmine, per the architecture's native-authorization
  # invariant — this blueprint does not and must not attempt to model them.
  # ============================================================

  - id: entitlement-redmine-access
    model: authentik_core.applicationentitlement
    identifiers:
      app: !KeyOf bsystem-redmine-application
      name: redmine.access
    attrs:
      attributes: {}


  # ============================================================
  # Redmine Application Access Bindings
  #
  # Same staff groups as BSYSTEM-HUB, minus BSYSTEM-Customers: Redmine is an
  # internal delivery tool, not a customer-facing surface.
  # ============================================================

  - id: redmine-app-binding-admins
    model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf bsystem-redmine-application
      order: 0
    attrs:
      group: !Find [authentik_core.group, [name, BSYSTEM-Admins]]
      enabled: true
      negate: false

  - id: redmine-app-binding-managers
    model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf bsystem-redmine-application
      order: 10
    attrs:
      group: !Find [authentik_core.group, [name, BSYSTEM-Managers]]
      enabled: true
      negate: false

  - id: redmine-app-binding-developers
    model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf bsystem-redmine-application
      order: 20
    attrs:
      group: !Find [authentik_core.group, [name, BSYSTEM-Developers]]
      enabled: true
      negate: false

  - id: redmine-app-binding-qa
    model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf bsystem-redmine-application
      order: 30
    attrs:
      group: !Find [authentik_core.group, [name, BSYSTEM-QA]]
      enabled: true
      negate: false

  - id: redmine-app-binding-support
    model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf bsystem-redmine-application
      order: 40
    attrs:
      group: !Find [authentik_core.group, [name, BSYSTEM-Support]]
      enabled: true
      negate: false

  - id: redmine-app-binding-devops
    model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf bsystem-redmine-application
      order: 50
    attrs:
      group: !Find [authentik_core.group, [name, BSYSTEM-DevOps]]
      enabled: true
      negate: false


  # ============================================================
  # Entitlement: redmine.access
  # ============================================================

  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf entitlement-redmine-access
      order: 0
    attrs:
      group: !Find [authentik_core.group, [name, BSYSTEM-Admins]]
      enabled: true
      negate: false

  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf entitlement-redmine-access
      order: 10
    attrs:
      group: !Find [authentik_core.group, [name, BSYSTEM-Managers]]
      enabled: true
      negate: false

  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf entitlement-redmine-access
      order: 20
    attrs:
      group: !Find [authentik_core.group, [name, BSYSTEM-Developers]]
      enabled: true
      negate: false

  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf entitlement-redmine-access
      order: 30
    attrs:
      group: !Find [authentik_core.group, [name, BSYSTEM-QA]]
      enabled: true
      negate: false

  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf entitlement-redmine-access
      order: 40
    attrs:
      group: !Find [authentik_core.group, [name, BSYSTEM-Support]]
      enabled: true
      negate: false

  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf entitlement-redmine-access
      order: 50
    attrs:
      group: !Find [authentik_core.group, [name, BSYSTEM-DevOps]]
      enabled: true
      negate: false
