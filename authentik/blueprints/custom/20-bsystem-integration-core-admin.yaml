# yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
version: 1
metadata:
  name: BSYSTEM - Integration Core User Administration

context:
  admin_token: !Env [BSYSTEM_AUTHENTIK_ADMIN_TOKEN, null]

entries:
  - id: integration-core-user-admin-role
    model: authentik_rbac.role
    identifiers:
      name: BSYSTEM Integration Core User Administration
    attrs:
      permissions:
        - authentik_core.view_user
        - authentik_core.add_user
        - authentik_core.change_user
        - authentik_core.reset_user_password
        - authentik_core.view_group

  - id: integration-core-user-admin
    model: authentik_core.user
    identifiers:
      username: bsystem-integration-core-admin
    attrs:
      name: BSYSTEM Integration Core User Administration
      type: service_account
      is_active: true
      roles:
        - !KeyOf integration-core-user-admin-role

  - model: authentik_core.token
    state: present
    conditions:
      - !If [!Context admin_token]
    identifiers:
      identifier: bsystem-integration-core-user-admin
      intent: api
      expiring: false
      user: !KeyOf integration-core-user-admin
    attrs:
      key: !Context admin_token
