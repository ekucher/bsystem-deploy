# yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json

version: 1

metadata:
  name: BSYSTEM - HUB

entries:

  # ============================================================
  # BSYSTEM-HUB Provider-specific invalidation flow
  # ============================================================

  - id: bsystem-hub-invalidation-flow
    model: authentik_flows.flow

    identifiers:
      slug: bsystem-hub-invalidation-flow

    attrs:
      designation: invalidation
      name: BSYSTEM-HUB logout
      title: "You've logged out of BSYSTEM-HUB."
      authentication: none

  - id: bsystem-hub-invalidation-logout-binding
    model: authentik_flows.flowstagebinding

    identifiers:
      order: 0
      stage: !Find
        - authentik_stages_user_logout.userlogoutstage
        - [name, default-invalidation-logout]
      target: !KeyOf bsystem-hub-invalidation-flow


  # ============================================================
  # BSYSTEM-HUB OAuth2 / OpenID Connect Provider
  # ============================================================

  - id: bsystem-hub-provider
    model: authentik_providers_oauth2.oauth2provider

    identifiers:
      name: Provider for BSYSTEM-HUB

    attrs:
      authorization_flow: !Find
        - authentik_flows.flow
        - [slug, default-provider-authorization-implicit-consent]

      invalidation_flow: !KeyOf bsystem-hub-invalidation-flow

      client_type: public

      grant_types:
        - authorization_code

      redirect_uris:
        - matching_mode: strict
          redirect_uri_type: authorization
          url: http://localhost:8081/auth/callback

      access_code_validity: minutes=1
      access_token_validity: minutes=5
      refresh_token_validity: days=30
      refresh_token_threshold: hours=1

      sub_mode: hashed_user_id
      issuer_mode: per_provider
      include_claims_in_id_token: true

      signing_key: !Find
        - authentik_crypto.certificatekeypair
        - [name, authentik Self-signed Certificate]

      property_mappings:
        - !Find
          - authentik_providers_oauth2.scopemapping
          - [managed, goauthentik.io/providers/oauth2/scope-openid]

        - !Find
          - authentik_providers_oauth2.scopemapping
          - [managed, goauthentik.io/providers/oauth2/scope-profile]

        - !Find
          - authentik_providers_oauth2.scopemapping
          - [managed, goauthentik.io/providers/oauth2/scope-email]

        - !Find
          - authentik_providers_oauth2.scopemapping
          - [managed, goauthentik.io/providers/oauth2/scope-entitlements]

      logout_method: backchannel
      logout_uri: ""

  # ============================================================
  # BSYSTEM-HUB Application
  # ============================================================

  - id: bsystem-hub-application
    model: authentik_core.application

    identifiers:
      slug: bsystem-hub

    attrs:
      name: BSYSTEM-HUB
      provider: !KeyOf bsystem-hub-provider

      group: BSYSTEM-HUB
      policy_engine_mode: any

      meta_launch_url: http://localhost:8081
      meta_publisher: BSYSTEM
      meta_description: BSYSTEM centralized workspace

      meta_hide: false
      open_in_new_tab: false


  # ============================================================
  # BSYSTEM-HUB Application Entitlements
  # ============================================================

  - id: entitlement-hub-access
    model: authentik_core.applicationentitlement
    identifiers:
      app: !KeyOf bsystem-hub-application
      name: hub.access
    attrs:
      attributes: {}

  - id: entitlement-hub-admin
    model: authentik_core.applicationentitlement
    identifiers:
      app: !KeyOf bsystem-hub-application
      name: hub.admin
    attrs:
      attributes: {}

  - id: entitlement-hub-users-read
    model: authentik_core.applicationentitlement
