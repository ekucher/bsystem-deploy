# yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
#
# Stage 1 native application: Outline.
#
# Outline remains authoritative for its own documents, collections, groups
# and sharing (see docs/stage-1/10-OUTLINE-INTEGRATION.md); this blueprint
# only lets a human sign into Outline directly through authentik and grants
# the coarse "can reach this app at all" entitlement. It does not attempt to
# model Outline's own per-collection/per-document permissions.
#
# Follows the same four-part shape as 10-bsystem-hub.yaml: invalidation flow,
# OAuth2/OIDC provider, application, entitlement + policy bindings.

version: 1

metadata:
  name: BSYSTEM - Outline

context:
  # Browser-visible canonical origin for Outline (see .env.example). Empty
  # leaves the redirect_uri pointing nowhere until the operator sets it.
  outline_public_url: !Env [OUTLINE_PUBLIC_URL, ""]

entries:

  # ============================================================
  # Outline Provider-specific invalidation flow
  # ============================================================

  - id: bsystem-outline-invalidation-flow
    model: authentik_flows.flow

    identifiers:
      slug: bsystem-outline-invalidation-flow

    attrs:
      designation: invalidation
      name: BSYSTEM - Outline logout
      title: "You've logged out of Outline."
      authentication: none

  - id: bsystem-outline-invalidation-logout-binding
    model: authentik_flows.flowstagebinding

    identifiers:
      order: 0
      stage: !Find
        - authentik_stages_user_logout.userlogoutstage
        - [name, default-invalidation-logout]
      target: !KeyOf bsystem-outline-invalidation-flow


  # ============================================================
  # Outline OAuth2 / OpenID Connect Provider
  #
  # Redirect URI matches Outline's own built-in OIDC plugin callback route.
  # Verify this path against the pinned upstream/VERSION in bsystem-outline
  # before a real STAGE/PROD cutover (see docs/stage-1/10-OUTLINE-INTEGRATION.md
  # section 9 — the exact extension point is an open implementation decision).
  # ============================================================

  - id: bsystem-outline-provider
    model: authentik_providers_oauth2.oauth2provider

    identifiers:
      name: Provider for Outline

    attrs:
      authorization_flow: !Find
        - authentik_flows.flow
        - [slug, default-provider-authorization-implicit-consent]

      invalidation_flow: !KeyOf bsystem-outline-invalidation-flow

      client_type: public

      grant_types:
        - authorization_code

      redirect_uris:
        - matching_mode: strict
          redirect_uri_type: authorization
          url: !Format ["%s/auth/oidc.callback", !Context outline_public_url]

      access_code_validity: minutes=1
      access_token_validity: minutes=5
      refresh_token_validity: days=30
      refresh_token_threshold: hours=1

      sub_mode: hashed_user_id
      issuer_mode: per_provider
      include_claims_in_id_token: true

      signing_key: !Find
        - authentik_crypto.certificatekeypair
        - [name, authentik Self-signed Certificate]

      property_mappings:
        - !Find
          - authentik_providers_oauth2.scopemapping
          - [managed, goauthentik.io/providers/oauth2/scope-openid]

        - !Find
          - authentik_providers_oauth2.scopemapping
          - [managed, goauthentik.io/providers/oauth2/scope-profile]

        - !Find
          - authentik_providers_oauth2.scopemapping
          - [managed, goauthentik.io/providers/oauth2/scope-email]

        - !Find
          - authentik_providers_oauth2.scopemapping
          - [managed, goauthentik.io/providers/oauth2/scope-entitlements]

      logout_method: backchannel
      logout_uri: ""

  # ============================================================
  # Outline Application
  # ============================================================

  - id: bsystem-outline-application
    model: authentik_core.application

    identifiers:
      slug: bsystem-outline

    attrs:
      name: Outline
      provider: !KeyOf bsystem-outline-provider

      group: BSYSTEM-Outline
      policy_engine_mode: any

      meta_launch_url: !Context outline_public_url
      meta_publisher: BSYSTEM
      meta_description: Native documentation/wiki

      meta_hide: false
      open_in_new_tab: false


  # ============================================================
  # Outline Application Entitlement
  #
  # Coarse "can reach this app at all" only. Collection/document-level
  # permissions stay entirely inside Outline, per the architecture's
  # native-authorization invariant — this blueprint does not and must not
  # attempt to model them.
  # ============================================================

  - id: entitlement-outline-access
    model: authentik_core.applicationentitlement
    identifiers:
      app: !KeyOf bsystem-outline-application
      name: outline.access
    attrs:
      attributes: {}


  # ============================================================
  # Outline Application Access Bindings
  #
  # Same staff groups as BSYSTEM-HUB, minus BSYSTEM-Customers: Outline is an
  # internal knowledge base, not a customer-facing surface.
  # ============================================================

  - id: outline-app-binding-admins
    model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf bsystem-outline-application
      order: 0
    attrs:
      group: !Find [authentik_core.group, [name, BSYSTEM-Admins]]
      enabled: true
      negate: false

  - id: outline-app-binding-managers
    model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf bsystem-outline-application
      order: 10
    attrs:
      group: !Find [authentik_core.group, [name, BSYSTEM-Managers]]
      enabled: true
      negate: false

  - id: outline-app-binding-developers
    model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf bsystem-outline-application
      order: 20
    attrs:
      group: !Find [authentik_core.group, [name, BSYSTEM-Developers]]
      enabled: true
      negate: false

  - id: outline-app-binding-qa
    model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf bsystem-outline-application
      order: 30
    attrs:
      group: !Find [authentik_core.group, [name, BSYSTEM-QA]]
      enabled: true
      negate: false

  - id: outline-app-binding-support
    model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf bsystem-outline-application
      order: 40
    attrs:
      group: !Find [authentik_core.group, [name, BSYSTEM-Support]]
      enabled: true
      negate: false

  - id: outline-app-binding-devops
    model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf bsystem-outline-application
      order: 50
    attrs:
      group: !Find [authentik_core.group, [name, BSYSTEM-DevOps]]
      enabled: true
      negate: false


  # ============================================================
  # Entitlement: outline.access
  # ============================================================

  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf entitlement-outline-access
      order: 0
    attrs:
      group: !Find [authentik_core.group, [name, BSYSTEM-Admins]]
      enabled: true
      negate: false

  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf entitlement-outline-access
      order: 10
    attrs:
      group: !Find [authentik_core.group, [name, BSYSTEM-Managers]]
      enabled: true
      negate: false

  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf entitlement-outline-access
      order: 20
    attrs:
      group: !Find [authentik_core.group, [name, BSYSTEM-Developers]]
      enabled: true
      negate: false

  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf entitlement-outline-access
      order: 30
    attrs:
      group: !Find [authentik_core.group, [name, BSYSTEM-QA]]
      enabled: true
      negate: false

  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf entitlement-outline-access
      order: 40
    attrs:
      group: !Find [authentik_core.group, [name, BSYSTEM-Support]]
      enabled: true
      negate: false

  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf entitlement-outline-access
      order: 50
    attrs:
      group: !Find [authentik_core.group, [name, BSYSTEM-DevOps]]
      enabled: true
      negate: false
