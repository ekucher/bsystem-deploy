name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  mocks:
    name: Mock upstreams
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mocks
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: mocks/go.mod
          cache: false

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt required for: $unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      - name: Build mock images
        run: |
          for mock in mock-identity mock-espocrm mock-redmine mock-outline; do
            docker build --build-arg "MOCK=$mock" -t "bsystem/$mock:ci" .
          done

  compose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare CI environment
        run: |
          cat > .env <<'EOF'
          POSTGRES_PASSWORD=ci-postgres-password
          AUTHENTIK_SECRET_KEY=ci-authentik-secret-key-abcdefghijklmnopqrstuvwxyz-0123456789
          VITE_OIDC_AUTHORITY=http://localhost:9000/application/o/bsystem-hub/
          VITE_OIDC_CLIENT_ID=ci-public-client
          ESPOCRM_URL=
          ESPOCRM_API_KEY=
          REDMINE_URL=
          REDMINE_API_KEY=
          EOF

      - name: Validate Docker Compose
        run: docker compose config --quiet

      - name: Validate rendered configuration
        run: docker compose config > /tmp/bsystem-compose.yml
