name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  mocks:
    name: Mock upstreams
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mocks
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: mocks/go.mod
          cache: false

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt required for: $unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      - name: Build mock images
        run: |
          for mock in mock-identity mock-espocrm mock-redmine mock-outline; do
            docker build --build-arg "MOCK=$mock" -t "bsystem/$mock:ci" .
          done

  compose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: loadtest/go.mod
          cache: false

      - name: Prepare CI environment
        run: |
          cat > .env <<'EOF'
          POSTGRES_PASSWORD=ci-postgres-password
          AUTHENTIK_SECRET_KEY=ci-authentik-secret-key-abcdefghijklmnopqrstuvwxyz-0123456789
          VITE_OIDC_AUTHORITY=http://localhost:9000/application/o/bsystem-hub/
          VITE_OIDC_CLIENT_ID=ci-public-client
          ESPOCRM_URL=
          ESPOCRM_API_KEY=
          REDMINE_URL=
          REDMINE_API_KEY=
          EOF

      - name: Validate Docker Compose
        run: docker compose config --quiet

      - name: Validate rendered configuration
        run: docker compose config > /tmp/bsystem-compose.yml

      - name: Check the load harness compiles
        run: |
          cd loadtest
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt required for: $unformatted"
            exit 1
          fi
          go vet ./...
          go build ./...

      - name: Check container hardening
        env:
          INTEGRATION_CORE_CONTEXT: ./bsystem-integration-core
        run: |
          python3 -m pip install --quiet pyyaml
          python3 scripts/check-hardening.py docker-compose.yml docker-compose.e2e.yml

      - name: Validate E2E Docker Compose
        env:
          INTEGRATION_CORE_CONTEXT: ./bsystem-integration-core
        run: docker compose -f docker-compose.e2e.yml config --quiet

      - name: Validate the stage Compose overlay
        run: docker compose -f docker-compose.yml -f docker-compose.stage.yml config --quiet

      # The overlay is checked as part of the stack it modifies: on its own
      # it is not a complete Compose file, and checking it alone would pass
      # vacuously.
      - name: Check stage container hardening
        run: python3 scripts/check-hardening.py "docker-compose.yml+docker-compose.stage.yml"

  stage-assets:
    name: Stage assets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check shell scripts parse
        run: |
          status=0
          while IFS= read -r script; do
            if bash -n "$script"; then
              echo "ok      $script"
            else
              echo "::error file=$script::this script does not parse"
              status=1
            fi
          done < <(find scripts -name '*.sh' -type f | sort)
          exit "$status"

      - name: Lint shell scripts
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          # SC1091: sourced files are not present at lint time.
          # SC2317: reachability analysis misreads trap-invoked cleanup.
          shellcheck --severity=warning --exclude=SC1091,SC2317 \
            scripts/stage-preflight.sh scripts/stage-smoke.sh scripts/release-manifest.sh

      - name: Check PowerShell scripts parse
        shell: pwsh
        run: |
          $failed = $false
          foreach ($script in Get-ChildItem -Path scripts -Filter *.ps1 -Recurse) {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($script.FullName, [ref]$null, [ref]$errors) | Out-Null
            if ($errors -and $errors.Count -gt 0) {
              Write-Host "::error file=$($script.FullName)::$($errors[0].Message)"
              $failed = $true
            } else {
              Write-Host "ok      $($script.Name)"
            }
          }
          if ($failed) { exit 1 }

      - name: Run the stage script tests
        run: bash scripts/tests/stage-scripts.test.sh

      - name: Check the release manifest generates
        run: |
          ./scripts/release-manifest.sh > /tmp/release-manifest.json
          python3 -c "import json; json.load(open('/tmp/release-manifest.json'))"
          echo "the release manifest is valid JSON"

      # A stage file is exactly the kind of file a real value gets pasted into
      # "just to test something". gitleaks covers the repository; this is the
      # narrower check that the stage assets themselves stay free of values
      # that look like configuration someone forgot to remove.
      - name: Check stage assets carry no secret-like value
        run: python3 scripts/check-stage-secrets.py

      - name: Check acceptance docs reference paths that exist
        run: python3 scripts/check-doc-links.py

      - name: Check every Go module is covered by the security scanners
        run: |
          python3 -m pip install --quiet pyyaml
          python3 scripts/check-scan-coverage.py

      - name: Check no build artefact is tracked
        run: python3 scripts/check-artifacts.py

      # The Integration Core is not checked out in this job, so the script
      # compares the two lists this repository owns and says so. The third —
      # the platform's own RBAC seed — is compared in the E2E job, which has
      # the sibling checkout.
      - name: Check the BSYSTEM group names agree
        run: python3 scripts/check-identity-groups.py

  e2e:
    name: Autonomous E2E
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout deployment repository
        uses: actions/checkout@v7

      # A branch in the Integration Core with the same name as this one is
      # used when it exists, so a change spanning both repositories can be
      # validated before either side merges.
      - name: Resolve the Integration Core branch
        id: core-ref
        run: |
          ref="${{ github.head_ref || github.ref_name }}"
          if git ls-remote --exit-code --heads https://github.com/ekucher/bsystem-integration-core "$ref" >/dev/null 2>&1; then
            echo "Using matching bsystem-integration-core branch: $ref"
          else
            echo "No matching bsystem-integration-core branch; using main"
            ref=main
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Checkout Integration Core
        uses: actions/checkout@v7
        with:
          repository: ekucher/bsystem-integration-core
          ref: ${{ steps.core-ref.outputs.ref }}
          path: bsystem-integration-core

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: e2e/go.mod
          cache: false

      - name: Check formatting
        working-directory: e2e
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt required for: $unformatted"
            exit 1
          fi

      - name: Vet
        working-directory: e2e
        run: go vet ./...

      # Here the Integration Core is checked out beside this repository, so the
      # script also compares the platform's RBAC seed — the list that actually
      # decides which role a group grants.
      - name: Check the BSYSTEM group names agree with the platform's seed
        run: python3 scripts/check-identity-groups.py

      - name: Start the E2E stack
        env:
          INTEGRATION_CORE_CONTEXT: ./bsystem-integration-core
        run: docker compose -f docker-compose.e2e.yml up -d --build --wait --wait-timeout 300

      - name: Run E2E scenarios
        working-directory: e2e
        env:
          # The scenarios skip when no stack is configured, so that
          # `go test ./...` stays safe on a developer's machine. A skipped Go
          # test exits zero, so here — where the stack is up and the whole
          # point of the job is to exercise it — a missing E2E_BASE_URL must
          # fail rather than pass silently.
          E2E_REQUIRED: "1"
          E2E_BASE_URL: http://127.0.0.1:8080
          # The second core, with Outline deliberately unconfigured.
          E2E_PARTIAL_BASE_URL: http://127.0.0.1:8081
          E2E_IDENTITY_URL: http://127.0.0.1:9000
          E2E_ESPOCRM_URL: http://127.0.0.1:8090
          E2E_REDMINE_URL: http://127.0.0.1:8091
          E2E_OUTLINE_URL: http://127.0.0.1:8092
          E2E_NATS_ADDR: 127.0.0.1:4222
        run: go test -v -count=1 -timeout 15m ./...

      - name: Collect stack logs on failure
        if: failure()
        env:
          INTEGRATION_CORE_CONTEXT: ./bsystem-integration-core
        run: docker compose -f docker-compose.e2e.yml logs --no-color --tail=300

      - name: Tear down the E2E stack
        if: always()
        env:
          INTEGRATION_CORE_CONTEXT: ./bsystem-integration-core
        run: docker compose -f docker-compose.e2e.yml down -v --remove-orphans
