name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # A ref asked for by hand is a claim that it exists. Falling back to main
  # would validate a pair nobody asked for and report it as the requested one,
  # so a core_ref that cannot be resolved fails the job.
  workflow_dispatch:
    inputs:
      core_ref:
        description: "Integration Core branch, tag or SHA to validate against. Fails if it does not exist."
        required: false
        type: string

permissions:
  contents: read

jobs:
  mocks:
    name: Mock upstreams
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mocks
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: mocks/go.mod
          cache: false

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt required for: $unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      - name: Build mock images
        run: |
          for mock in mock-identity mock-espocrm mock-redmine mock-outline; do
            docker build --build-arg "MOCK=$mock" -t "bsystem/$mock:ci" .
          done

  compose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: loadtest/go.mod
          cache: false

      - name: Prepare CI environment
        run: |
          cat > .env <<'EOF'
          POSTGRES_PASSWORD=ci-postgres-password
          AUTHENTIK_SECRET_KEY=ci-authentik-secret-key-abcdefghijklmnopqrstuvwxyz-0123456789
          VITE_OIDC_AUTHORITY=http://localhost:9000/application/o/bsystem-hub/
          VITE_OIDC_CLIENT_ID=ci-public-client
          ESPOCRM_URL=
          ESPOCRM_API_KEY=
          REDMINE_URL=
          REDMINE_API_KEY=
          EOF

      - name: Validate Docker Compose
        run: docker compose config --quiet

      - name: Validate rendered configuration
        run: docker compose config > /tmp/bsystem-compose.yml

      - name: Check the load harness compiles
        run: |
          cd loadtest
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt required for: $unformatted"
            exit 1
          fi
          go vet ./...
          go build ./...

      - name: Check container hardening
        env:
          INTEGRATION_CORE_CONTEXT: ./bsystem-integration-core
        run: |
          python3 -m pip install --quiet pyyaml
          python3 scripts/check-hardening.py docker-compose.yml docker-compose.e2e.yml

      - name: Validate E2E Docker Compose
        env:
          INTEGRATION_CORE_CONTEXT: ./bsystem-integration-core
        run: docker compose -f docker-compose.e2e.yml config --quiet

      - name: Validate the stage Compose overlay
        run: docker compose -f docker-compose.yml -f docker-compose.stage.yml config --quiet

      # The overlay is checked as part of the stack it modifies: on its own
      # it is not a complete Compose file, and checking it alone would pass
      # vacuously.
      - name: Check stage container hardening
        run: python3 scripts/check-hardening.py "docker-compose.yml+docker-compose.stage.yml"

      - name: Validate the Stage 1 native-apps Compose overlay
        run: docker compose -f docker-compose.yml -f docker-compose.stage1-native-apps.yml config --quiet

      - name: Check Stage 1 native-apps container hardening
        run: python3 scripts/check-hardening.py "docker-compose.yml+docker-compose.stage1-native-apps.yml"

      # The overlay's own header promises the platform starts "without
      # needing the BHUB frontend running at all". Nothing else here would
      # notice `hub` quietly creeping back into it — check-hardening.py would
      # simply harden it like any other service — so this asserts the
      # resolved service list actually omits it and that the Compose profile
      # gating it is still in place.
      - name: Check the Stage 1 overlay excludes the BHUB frontend
        run: python3 scripts/check-stage1-overlay.py

  stage-assets:
    name: Stage assets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check shell scripts parse
        run: |
          status=0
          while IFS= read -r script; do
            if bash -n "$script"; then
              echo "ok      $script"
            else
              echo "::error file=$script::this script does not parse"
              status=1
            fi
          done < <(find scripts -name '*.sh' -type f | sort)
          exit "$status"

      - name: Lint shell scripts
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          # SC1091: sourced files are not present at lint time.
          # SC2317: reachability analysis misreads trap-invoked cleanup.
          shellcheck --severity=warning --exclude=SC1091,SC2317 \
            scripts/stage-preflight.sh scripts/stage-smoke.sh scripts/release-manifest.sh

      - name: Check PowerShell scripts parse
        shell: pwsh
        run: |
          $failed = $false
          foreach ($script in Get-ChildItem -Path scripts -Filter *.ps1 -Recurse) {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($script.FullName, [ref]$null, [ref]$errors) | Out-Null
            if ($errors -and $errors.Count -gt 0) {
              Write-Host "::error file=$($script.FullName)::$($errors[0].Message)"
              $failed = $true
            } else {
              Write-Host "ok      $($script.Name)"
            }
          }
          if ($failed) { exit 1 }

      - name: Run the stage script tests
        run: bash scripts/tests/stage-scripts.test.sh

      - name: Check the release manifest generates
        run: |
          ./scripts/release-manifest.sh > /tmp/release-manifest.json
          python3 -c "import json; json.load(open('/tmp/release-manifest.json'))"
          echo "the release manifest is valid JSON"

      # A stage file is exactly the kind of file a real value gets pasted into
      # "just to test something". gitleaks covers the repository; this is the
      # narrower check that the stage assets themselves stay free of values
      # that look like configuration someone forgot to remove.
      - name: Check stage assets carry no secret-like value
        run: python3 scripts/check-stage-secrets.py

      # check-stage-secrets.py is scoped to a curated list of stage-adjacent
      # files. This is the repo-wide sweep: a real hostname can land in a
      # test file or a code comment just as easily as a stage asset -- that
      # is exactly how it happened once, in a sibling repository's test file,
      # during a Stage 1 SSO round.
      - name: Check no real hostnames are committed anywhere in the repo
        run: python3 scripts/check-no-real-hostnames.py

      - name: Check acceptance docs reference paths that exist
        run: python3 scripts/check-doc-links.py

      - name: Check the documentation and the Compose files agree
        run: |
          python3 -m pip install --quiet pyyaml
          python3 scripts/check-config-docs.py

      - name: Check every Go module is covered by the security scanners
        run: |
          python3 -m pip install --quiet pyyaml
          python3 scripts/check-scan-coverage.py

      - name: Check no build artefact is tracked
        run: python3 scripts/check-artifacts.py

      # The Integration Core is not checked out in this job, so the script
      # compares the two lists this repository owns and says so. The third —
      # the platform's own RBAC seed — is compared in the E2E job, which has
      # the sibling checkout.
      - name: Check the BSYSTEM group names agree
        run: python3 scripts/check-identity-groups.py

      # The Stage 1 native application service identities are supposed to be
      # least-privilege — svc-outline in particular is documented as
      # read-only because it only ever lists relationships. Integration Core
      # cannot yet enforce that per-service (see docs/SERVICE-IDENTITIES.md),
      # so this is a static check against the declared intent rather than a
      # runtime authorization test; it still catches the table quietly
      # drifting to claim more access than a caller needs, or an identity
      # losing its documentation entirely.
      - name: Check Stage 1 service identity permissions stay least-privilege
        run: python3 scripts/check-service-identity-scopes.py

  e2e:
    name: Autonomous E2E
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout deployment repository
        uses: actions/checkout@v7

      # A branch in the Integration Core with the same name as this one is
      # used when it exists, so a change spanning both repositories can be
      # validated before either side merges.
      # Which pair is being validated, decided here and recorded where somebody
      # will see it. The fallback was already logged, but a line in a long log
      # is not a record: nothing said which Integration Core commit a green run
      # was green against, so a stale provider and a validated one looked the
      # same from the outside.
      - name: Resolve the Integration Core branch
        id: core-ref
        env:
          REQUESTED: ${{ inputs.core_ref }}
        run: |
          remote=https://github.com/ekucher/bsystem-integration-core
          if [ -n "$REQUESTED" ]; then
            # Asked for by hand, so it is a claim rather than a guess.
            if ! git ls-remote --exit-code "$remote" "$REQUESTED" >/dev/null 2>&1; then
              echo "::error::Integration Core has no ref '$REQUESTED'. It was requested explicitly, so this run fails rather than silently validating against main."
              exit 1
            fi
            ref="$REQUESTED"
            reason="requested explicitly"
          else
            ref="${{ github.head_ref || github.ref_name }}"
            if git ls-remote --exit-code --heads "$remote" "$ref" >/dev/null 2>&1; then
              reason="matching branch"
            else
              ref=main
              reason="no matching branch, fell back to main"
            fi
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "reason=$reason" >> "$GITHUB_OUTPUT"
          echo "Integration Core ref: \`$ref\` ($reason)" >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout Integration Core
        uses: actions/checkout@v7
        with:
          repository: ekucher/bsystem-integration-core
          ref: ${{ steps.core-ref.outputs.ref }}
          path: bsystem-integration-core

      # A green E2E run is a statement about a pair of commits, and until now it
      # did not say which pair. The manifest is the artefact that answers "what
      # was actually validated" after the logs have scrolled by, and it is the
      # compatibility record P26 asks for.
      - name: Record the validated pair
        run: python3 scripts/compatibility-manifest.py > compatibility.json
        env:
          DEPLOY_SHA: ${{ github.sha }}
          CORE_REF: ${{ steps.core-ref.outputs.ref }}
          CORE_REASON: ${{ steps.core-ref.outputs.reason }}

      - name: Publish the compatibility manifest
        uses: actions/upload-artifact@v4
        with:
          name: compatibility-manifest
          path: compatibility.json
          retention-days: 90

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: e2e/go.mod
          cache: false

      - name: Check formatting
        working-directory: e2e
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt required for: $unformatted"
            exit 1
          fi

      - name: Vet
        working-directory: e2e
        run: go vet ./...

      # Only this job checks out the Integration Core, and a Global ID prefix
      # is written once here and once in Core's counters seed, so the
      # comparison exists nowhere else. It is deliberately not in Stage
      # assets: without Core beside it the check would print a note and pass,
      # which is the vacuous green this wave keeps finding.
      - name: Check the Global ID prefixes agree with the platform's seed
        run: python3 scripts/check-global-ids.py

      # Same placement and the same reason: the specification lives in the
      # Integration Core, so this comparison exists only where Core is checked
      # out. Core's own documentation is checked by Core's CI — this repository
      # is not the place to make another repository's docs fail.
      - name: Check the documented endpoints exist
        run: |
          python3 -m pip install --quiet pyyaml
          python3 scripts/check-documented-endpoints.py

      # Here the Integration Core is checked out beside this repository, so the
      # script also compares the platform's RBAC seed — the list that actually
      # decides which role a group grants.
      - name: Check the BSYSTEM group names agree with the platform's seed
        run: python3 scripts/check-identity-groups.py

      - name: Start the E2E stack
        env:
          INTEGRATION_CORE_CONTEXT: ./bsystem-integration-core
        run: docker compose -f docker-compose.e2e.yml up -d --build --wait --wait-timeout 300

      - name: Run E2E scenarios
        working-directory: e2e
        env:
          # The scenarios skip when no stack is configured, so that
          # `go test ./...` stays safe on a developer's machine. A skipped Go
          # test exits zero, so here — where the stack is up and the whole
          # point of the job is to exercise it — a missing E2E_BASE_URL must
          # fail rather than pass silently.
          E2E_REQUIRED: "1"
          E2E_BASE_URL: http://127.0.0.1:8080
          # The second core, with Outline deliberately unconfigured.
          E2E_PARTIAL_BASE_URL: http://127.0.0.1:8081
          E2E_IDENTITY_URL: http://127.0.0.1:9000
          E2E_ESPOCRM_URL: http://127.0.0.1:8090
          E2E_REDMINE_URL: http://127.0.0.1:8091
          E2E_OUTLINE_URL: http://127.0.0.1:8092
          E2E_NATS_ADDR: 127.0.0.1:4222
          # The outage scenarios stop and start dependency containers. They are
          # opt-in because they are destructive to a stack somebody may be
          # using, and mandatory here: with E2E_REQUIRED set, a run that cannot
          # reach Docker refuses to start rather than skipping every one of
          # them and exiting zero. See e2e/lifecycle.go.
          E2E_LIFECYCLE: "1"
          E2E_COMPOSE_FILE: ../docker-compose.e2e.yml
          # docker compose reads the whole file for any subcommand, including
          # stop, so the build context has to resolve here too.
          INTEGRATION_CORE_CONTEXT: ./bsystem-integration-core
        run: go test -v -count=1 -timeout 25m ./...

      - name: Collect stack logs on failure
        if: failure()
        env:
          INTEGRATION_CORE_CONTEXT: ./bsystem-integration-core
        run: docker compose -f docker-compose.e2e.yml logs --no-color --tail=300

      - name: Tear down the E2E stack
        if: always()
        env:
          INTEGRATION_CORE_CONTEXT: ./bsystem-integration-core
        run: docker compose -f docker-compose.e2e.yml down -v --remove-orphans

  # Backup and restore, on a stack of its own.
  #
  # The scenario destroys the database. Running it beside the others would turn
  # one failure here into a wall of failures everywhere, and the one that
  # mattered would be lost in it — so it gets its own runner, its own stack and
  # its own job, and the rest of the suite never sees a dropped database.
  backup:
    name: Backup and restore
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout deployment repository
        uses: actions/checkout@v7

      - name: Resolve the Integration Core branch
        id: core-ref
        run: |
          remote=https://github.com/ekucher/bsystem-integration-core
          ref="${{ github.head_ref || github.ref_name }}"
          if ! git ls-remote --exit-code --heads "$remote" "$ref" >/dev/null 2>&1; then
            ref=main
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Checkout Integration Core
        uses: actions/checkout@v7
        with:
          repository: ekucher/bsystem-integration-core
          ref: ${{ steps.core-ref.outputs.ref }}
          path: bsystem-integration-core

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: e2e/go.mod
          cache: false

      - name: Start the E2E stack
        env:
          INTEGRATION_CORE_CONTEXT: ./bsystem-integration-core
        run: docker compose -f docker-compose.e2e.yml up -d --build --wait --wait-timeout 300

      - name: Take a backup, destroy the database, and restore it
        working-directory: e2e
        env:
          E2E_REQUIRED: "1"
          E2E_BASE_URL: http://127.0.0.1:8080
          E2E_PARTIAL_BASE_URL: http://127.0.0.1:8081
          E2E_IDENTITY_URL: http://127.0.0.1:9000
          E2E_ESPOCRM_URL: http://127.0.0.1:8090
          E2E_REDMINE_URL: http://127.0.0.1:8091
          E2E_OUTLINE_URL: http://127.0.0.1:8092
          E2E_NATS_ADDR: 127.0.0.1:4222
          E2E_LIFECYCLE: "1"
          E2E_COMPOSE_FILE: ../docker-compose.e2e.yml
          # The job exists to run this one scenario, so a run that skipped it
          # and exited zero would be the worst possible outcome: a green check
          # that restored nothing.
          E2E_BACKUP: "1"
          E2E_BACKUP_REQUIRED: "1"
          INTEGRATION_CORE_CONTEXT: ./bsystem-integration-core
        run: go test -v -count=1 -timeout 15m -run 'Backup' ./...

      - name: Collect stack logs on failure
        if: failure()
        env:
          INTEGRATION_CORE_CONTEXT: ./bsystem-integration-core
        run: docker compose -f docker-compose.e2e.yml logs --no-color --tail=300

      # The dump never leaves the job. A database backup is the one artefact
      # nobody should be able to download from a CI run, so it is not uploaded
      # and the stack it came from is destroyed with its volumes.
      - name: Tear down the E2E stack
        if: always()
        env:
          INTEGRATION_CORE_CONTEXT: ./bsystem-integration-core
        run: docker compose -f docker-compose.e2e.yml down -v --remove-orphans
